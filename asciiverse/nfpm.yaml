# System packages (.deb, .rpm, .apk, Arch) for Mahjongg, built by nfpm from
# the same static binary as the av archive. The release workflow sets
# VERSION, RELEASE (our packaging release) and ARCH (amd64 or arm64), and
# puts the binary at stage/mahjongg.
#
# No .desktop file on purpose: av is the one place titles are started from,
# so Asciiverse packages never add menu entries (asciiverse/CLAUDE.md).
name: mahjongg
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/mahjongg
license: GPL-3.0-or-later
description: |
  Mahjong solitaire in the terminal, a clone of GNOME Mahjongg.
  All ten GNOME layouts, deals that are always solvable, hints, undo and
  reshuffle, best times per layout, and a saved game that survives closing
  the terminal. Play with the mouse or the keyboard. By radha, packaged by
  Asciiverse.
contents:
  - src: stage/mahjongg
    dst: /usr/bin/mahjongg
    file_info: { mode: 0755 }
  - src: LICENSE
    dst: /usr/share/doc/mahjongg/copyright
    file_info: { mode: 0644 }
  - src: README.md
    dst: /usr/share/doc/mahjongg/README.md
    file_info: { mode: 0644 }
